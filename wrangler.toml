## This file exists ONLY to stop Cloudflare's dashboard "Git integration"
## (Workers Builds) from mis-detecting this repo.
##
## What was happening without it: when Cloudflare builds straight from the
## repo root and finds no wrangler config there, it falls back to guessing
## a project type. It saw `docs/` (used for GitHub Pages) and one obvious
## asset folder, decided "static site," and deployed a brand-new Worker
## that just serves docs/index.html -- a duplicate of the GitHub Pages
## page, under a different Workers subdomain, with the real CRM backend
## never deployed.
##
## Fix: give the root a real config pointing at the actual Worker, so
## there's nothing left to guess. `main` is resolved relative to *this*
## file, so it points into crm-worker/.
##
## This mirrors crm-worker/wrangler.toml on purpose -- same Worker `name`
## and same D1 `database_name`, so builds triggered from either path
## update the SAME Worker/database rather than creating a second one.
## If you change name/bindings in crm-worker/wrangler.toml, update this
## file to match.
##
## crm-worker/wrangler.toml stays put too -- it's what local dev
## (`cd crm-worker && npm run dev`) and the GitHub Actions deploy workflow
## (.github/workflows/deploy-crm-worker.yml) use directly.

name = "n8n-crm-worker"
main = "crm-worker/src/index.js"
compatibility_date = "2026-07-23"

[[d1_databases]]
binding = "DB"
database_name = "n8n-crm-worker-db"
