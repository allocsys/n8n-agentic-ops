## Single source of truth for this Worker's config -- lives at the repo
## root on purpose, not in crm-worker/.
##
## Why: Cloudflare's dashboard Git integration (Workers Builds) builds from
## the repo root by default. If there's no config there, it guesses a
## project type from what it finds -- it once saw docs/ (used for GitHub
## Pages) and deployed a throwaway static-site Worker serving
## docs/index.html instead of the real CRM backend. Putting the real
## config where it looks first removes the guesswork entirely.
##
## `main` is resolved relative to *this* file, so it points into crm-worker/.
##
## Everything else points AT this file instead of keeping its own copy:
## - Local dev (`crm-worker/package.json` scripts) passes `-c ../wrangler.toml`
## - CI (`.github/workflows/ci.yml`) passes `-c ../wrangler.toml` too, but
##   only for `wrangler deploy --dry-run` as a config-sanity check -- CI
##   never deploys. Actual deploys are manual: the Cloudflare "Deploy to
##   Workers" button in crm-worker/README.md, or importing this repo via
##   the Cloudflare dashboard's Git integration (same one-click model
##   n8n-host uses on Render).
## - The Cloudflare dashboard finds it automatically at the root, no
##   "root directory" override needed
## There is deliberately no wrangler.toml inside crm-worker/ anymore --
## one file, nothing to keep in sync.

name = "n8n-crm-worker"
main = "crm-worker/src/index.js"
compatibility_date = "2026-07-23"

# No database_id set on purpose: Wrangler auto-provisions a new D1 database
# named "n8n-crm-worker-db" the first time this Worker is deployed (works
# from `wrangler deploy` and from the Cloudflare dashboard's Git integration
# too). See:
# https://developers.cloudflare.com/workers/wrangler/configuration/#automatic-provisioning
[[d1_databases]]
binding = "DB"
database_name = "n8n-crm-worker-db"
