services:
  - type: web
    name: n8n-agentic-ops
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: starter
    envVars:
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: GENERIC_TIMEZONE
        value: UTC
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      # Placeholders -- see n8n-host/README.md "One remaining manual step".
      # Render doesn't support self-referencing a service's own public URL
      # inside render.yaml, so these three get filled in once, after first
      # deploy, from the Render dashboard (same pattern as CRM_WORKER_BASE_URL
      # in crm-worker/README.md).
      - key: N8N_HOST
        value: REPLACE_WITH_YOUR_RENDER_HOSTNAME
      - key: N8N_EDITOR_BASE_URL
        value: REPLACE_WITH_YOUR_RENDER_URL
      - key: WEBHOOK_URL
        value: REPLACE_WITH_YOUR_RENDER_URL
      # Points workflow.json's CRM nodes ($env.CRM_WORKER_BASE_URL) at your
      # deployed CRM Worker. Same reason as the three placeholders above --
      # the Worker doesn't exist yet at blueprint-apply time -- so fill this
      # in after deploying it via crm-worker/README.md's "Deploy to
      # Cloudflare Workers" button. This must be a real container env var
      # (not n8n's in-app Settings -> Variables) since the workflow reads
      # it via $env, not $vars.
      - key: CRM_WORKER_BASE_URL
        value: REPLACE_WITH_YOUR_CRM_WORKER_URL
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
